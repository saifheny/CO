<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Notebook outline -->
    <rect x="-120" y="-150" width="240" height="300" rx="20" fill="white" opacity="0.95"/>
    <!-- Lines -->
    <line x1="-80" y1="-80" x2="80" y2="-80" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="-40" x2="60" y2="-40" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="40" x2="40" y2="40" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <!-- Pen -->
    <g transform="translate(60,80) rotate(-30)">
      <rect x="-8" y="-70" width="16" height="100" rx="3" fill="#dc2626"/>
      <polygon points="-8,30 8,30 0,50" fill="#374151"/>
      <rect x="-8" y="-70" width="16" height="15" rx="3" fill="#991b1b"/>
    </g>
    <!-- Sparkle -->
    <g transform="translate(-80,-120)" fill="#f59e0b">
      <circle cx="0" cy="0" r="5"/>
      <circle cx="12" cy="-12" r="3"/>
      <circle cx="-8" cy="-14" r="2"/>
    </g>
  </g>
</svg>
